<h1>Manage Users</h1>

<table border="1" cellpadding="8">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Date Joined</th>
        <th>Action</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.date_joined }}</td>
        <td>
            {% if not user.is_superuser %}
            <form method="POST" action="{% url 'delete_user' user.id %}">
                {% csrf_token %}
                <button type="submit" onclick="return confirm('Delete this user?')">
                    Delete
                </button>
            </form>
            {% else %}
                Admin
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>
